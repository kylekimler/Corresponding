name: hours-counter

on:
  push:
    branches: [main]
    paths:
      - 'src/hours/**'
      - 'services/hours-counter/**'
      - '.github/workflows/hours-counter.yml'

jobs:
  deploy:
    if: github.repository == 'kylekimler/Corresponding' && vars.HOURS_COUNTER_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Cloudflare Worker
        working-directory: services/hours-counter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
